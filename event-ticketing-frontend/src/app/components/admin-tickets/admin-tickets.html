<div class="p-8">
	<div class="flex justify-between items-center mb-6">
		<h1 class="text-2xl font-bold text-gray-900">Tickets</h1>
	</div>

	<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
		<table class="w-full">
			<thead class="bg-gray-50 border-b border-gray-100">
				<tr>
					<th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Event Name</th>
					<th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
					<th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
					<th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
					<th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Purchase Date</th>
					<th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
				</tr>
			</thead>
			<tbody>
				@for(ticket of filteredTickets; track ticket.id) {
					<tr class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
						<td class="px-6 py-4 text-sm text-gray-900">{{ ticket.eventName }}</td>
						<td class="px-6 py-4 text-sm text-gray-500">{{ ticket.userName }}</td>
						<td class="px-6 py-4 text-sm">
							<span class="inline-flex px-2.5 py-0.5 rounded-full border text-xs font-semibold" [class]="statusClasses(ticket.status)">{{ statusLabel(ticket.status) }}</span>
						</td>
						<td class="px-6 py-4 text-sm text-gray-500">{{ ticket.price }}</td>
						<td class="px-6 py-4 text-sm text-gray-500">{{ ticket.purchaseDate | displayDate }}</td>
						<td class="px-6 py-4 flex gap-2">
							@if (canCancel(ticket.status)) {
								<button mat-raised-button color="primary" (click)="cancelTicket(ticket.id, ticket.eventName)">Cancel</button>
							}
							<button mat-raised-button color="warn" (click)="deleteTicket(ticket.id, ticket.eventName)">Delete</button>
						</td>
					</tr>
				}
			</tbody>
		</table>
	</div>
</div>
