<div [ngClass]="role === 'Admin' ? 'bg-blue-800' : 'bg-gray-900'" class="flex flex-col h-full w-64 text-white">
  
  <div class="sidebar-header">
    <h2 [ngClass]="role === 'Admin' ? 'text-blue-200' : 'text-red-500'" class="text-lg font-bold">EventTicketing</h2>
  </div>

  <nav class="flex-1 px-3 py-6 flex flex-col gap-1">
    @if(role === 'Admin') {
      <a [routerLink]="['/admin']" 
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-blue-200 hover:bg-blue-700 hover:text-white font-medium transition-all">
        Dashboard
      </a>
      <a [routerLink]="['/admin/users']" 
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-blue-200 hover:bg-blue-700 hover:text-white font-medium transition-all">
        Users
      </a>
      <a [routerLink]="['/admin/events']" 
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-blue-200 hover:bg-blue-700 hover:text-white font-medium transition-all">
        Events
      </a>
      <a [routerLink]="['/admin/tickets']" 
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-blue-200 hover:bg-blue-700 hover:text-white font-medium transition-all">
        Tickets
      </a>
    } @else {
      <a [routerLink]="['/organizer-events']" 
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white font-medium transition-all">
        Mis eventos
      </a>
      <a [routerLink]="['/create-event']" 
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white font-medium transition-all">
        Crear evento
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <p class="text-gray-500 text-xs">Aviso legal · Privacidad</p>
    <p class="text-gray-500 text-xs mt-1">© 2026 EventTicketing</p>
  </div>

</div>
