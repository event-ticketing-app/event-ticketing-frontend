<div class="p-6">
  <mat-form-field appearance="outline" class="mb-4">
    <mat-label>Filter by status</mat-label>
    <mat-select [(ngModel)]="selectedStatus">
      <mat-option [value]="null">All</mat-option>
      <mat-option [value]="0">Reserved</mat-option>
      <mat-option [value]="1">Cancelled</mat-option>
      <mat-option [value]="2">Purchased</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="events-grid">
    @for (ticket of filteredTickets; track ticket.id) {
      <mat-card>
        <mat-card-header>
          <mat-card-title>{{ ticket.eventName }}</mat-card-title>
          <mat-card-subtitle>{{ ticket.eventDate | date:'dd/MM/yyyy' }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>{{ ticket.eventDescription }}</p>
          <p>{{ ticket.price }}€</p>
          <p>Status: {{ getStatusLabel(ticket.status) }}</p>
          <button mat-raised-button color="primary" [routerLink]="['/tickets', ticket.id]">View ticket</button>
          @if(ticket.status === 0) {
            <button mat-raised-button color="warn" (click)="cancel(ticket.id)">Cancel</button>
          }
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
