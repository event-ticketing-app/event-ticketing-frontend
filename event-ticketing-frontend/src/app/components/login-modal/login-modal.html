<div class="p-2">
  <div class="flex justify-between items-center mb-6">
    <span class="flex items-center gap-2 text-sm font-bold uppercase text-gray-700">
      <span class="w-2 h-2 rounded-full bg-red-600 inline-block"></span>
      Sign in or create account
    </span>
    <button mat-icon-button mat-dialog-close>
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <h2 class="text-2xl font-bold text-gray-900 mb-6">Welcome to EventTicketing</h2>

  <form (ngSubmit)="login()" class="flex flex-col gap-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="email" name="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Password</mat-label>
      <input matInput type="password" [(ngModel)]="password" name="password" />
    </mat-form-field>

    <button mat-stroked-button color="primary" type="submit" class="w-full py-3 text-base">
      Login
    </button>
  </form>

  <div class="flex justify-between items-center mt-6 pt-4 border-t border-gray-200">
    <span class="text-sm text-gray-500">Don't have an account?</span>
    <div class="flex gap-3">
      @if(isOrganizer) {
        <a routerLink="/register" [queryParams]="{role: 'organizer'}" mat-dialog-close class="text-sm text-red-600 font-medium">Start managing your events</a>
      } @else {
        <a routerLink="/register" mat-dialog-close class="text-sm text-red-600 font-medium">Sign up</a>
        <span class="text-gray-300">|</span>
        <a routerLink="/register" [queryParams]="{role: 'organizer'}" mat-dialog-close class="text-sm text-red-600 font-medium">Manage your events</a>
      }
    </div>
  </div>
</div>
