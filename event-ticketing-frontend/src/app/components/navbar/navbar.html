<nav
  class="w-full max-w-full overflow-x-clip bg-[#0B1422] border border-[#1A293E] px-4 sm:px-5 lg:px-8 py-3.5 flex items-center justify-between gap-4"
>
  <div class="flex items-center gap-3 min-w-0">
    @if(getRole() === 'Organizer' || getRole() === 'Admin') {
      <button
        mat-icon-button
        (click)="toggleSidebar()"
        class="h-10 w-10 rounded-xl bg-[#152236] border border-[#233857] text-slate-200 hover:text-white hover:bg-[#1B2C46] transition-all"
      >
        <mat-icon>menu</mat-icon>
      </button>
    }

    <a [routerLink]="['/events']" class="flex items-center gap-2.5 group min-w-0">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-red-600 to-rose-500 flex items-center justify-center shadow-md shadow-red-600/30 group-hover:scale-105 transition-transform duration-200">
        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z" />
        </svg>
      </div>

      <span class="text-lg font-extrabold tracking-tight text-white whitespace-nowrap">
        Event<span class="text-red-500">Ticketing</span>
      </span>

      @if(getRole() === 'Admin') {
        <span class="px-2 py-0.5 rounded-md bg-purple-500/15 border border-purple-500/30 text-purple-300 font-semibold text-[11px] uppercase tracking-wide">Admin</span>
      }

      @if(getRole() === 'Organizer') {
        <span class="px-2 py-0.5 rounded-md bg-amber-500/15 border border-amber-500/30 text-amber-300 font-semibold text-[11px] uppercase tracking-wide">Organizer</span>
      }
    </a>
  </div>

  <div class="flex-1 min-w-[170px] max-w-xl mx-1 sm:mx-3">
    <div class="relative w-full">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
      </div>

      <input
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearch($event)"
        placeholder="Search events..."
        class="search-input"
      />
    </div>
  </div>

  <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
    @if(!isLoggedIn()) {
      <button
        (click)="openLogin()"
        class="inline-flex items-center gap-2 px-3.5 sm:px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-200 hover:text-white bg-[#152236] hover:bg-[#1B2C46] border border-[#223654] transition-all"
      >
        Access
      </button>

      <button
        (click)="openOrganizerLogin()"
        class="inline-flex items-center gap-2 px-3.5 sm:px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-[#152236] hover:bg-[#1B2C46] border border-red-500/50 transition-all"
      >
        Create Event
      </button>
    }

    @if(isLoggedIn() && getRole() === 'User') {
      <a
        [routerLink]="['/my-tickets']"
        class="inline-flex items-center gap-2 px-3.5 sm:px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-100 bg-[#16243A] hover:bg-[#1E314F] border border-[#233857] hover:border-red-500/40 transition-all"
      >
        My tickets
      </a>
    }

    @if(isLoggedIn()) {
      <button
        [matMenuTriggerFor]="profileMenu"
        class="flex items-center gap-2 p-1.5 pr-2.5 rounded-xl bg-[#142135] hover:bg-[#1C2D47] border border-[#233857] transition-all"
      >
        <div
          [ngClass]="getRole() === 'Admin' ? 'from-purple-600 to-pink-600' : getRole() === 'Organizer' ? 'from-amber-500 to-orange-600' : 'from-indigo-500 to-blue-600'"
          class="w-8 h-8 rounded-lg bg-gradient-to-br flex items-center justify-center text-white font-bold text-xs ring-1 ring-white/20"
        >
          {{ getRole() === 'Admin' ? 'AD' : getRole() === 'Organizer' ? 'OR' : 'US' }}
        </div>

        <div class="text-left hidden md:block">
          <p class="text-xs font-semibold text-slate-200 leading-none">
            {{ getRole() === 'Admin' ? 'Admin User' : getRole() === 'Organizer' ? 'Organizer User' : 'User Account' }}
          </p>
          <p class="text-[10px] leading-tight" [ngClass]="getRole() === 'Admin' ? 'text-purple-400' : getRole() === 'Organizer' ? 'text-amber-400' : 'text-slate-400'">
            {{ getRole() || 'User' }}
          </p>
        </div>

        <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
        </svg>
      </button>

      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item>My account</button>
        <button mat-menu-item (click)="logout()">Logout</button>
      </mat-menu>
    }
  </div>
</nav>
