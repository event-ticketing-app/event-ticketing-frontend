<div class="p-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Users</h1>
    <button mat-raised-button color="primary" (click)="openCreateUser()">+ Create User</button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-50 border-b border-gray-100">
        <tr>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for(user of filteredUsers; track user.id) {
          <tr class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 text-sm text-gray-900">{{ user.name }}</td>
            <td class="px-6 py-4 text-sm text-gray-500">{{ user.email }}</td>
            <td class="px-6 py-4 text-sm">
              <span class="px-2 py-1 rounded-full text-xs font-medium"
                [ngClass]="{
                  'bg-blue-100 text-blue-700': user.role === 0,
                  'bg-green-100 text-green-700': user.role === 1,
                  'bg-gray-100 text-gray-700': user.role === 2
                }">
                {{ user.role === 0 ? 'Admin' : user.role === 1 ? 'Organizer' : 'User' }}
              </span>
            </td>
            <td class="px-6 py-4 flex gap-2">
              <button mat-raised-button color="primary" (click)="openEditUser(user)">Edit</button>
              <button mat-raised-button color="warn" (click)="deleteUser(user.id)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
