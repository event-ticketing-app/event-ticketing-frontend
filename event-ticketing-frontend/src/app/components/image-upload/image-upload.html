<div>
  <p class="text-sm font-medium text-gray-700 mt-0 mb-2">Event image</p>

  @if (imageUrl()) {
    <div class="relative rounded-xl overflow-hidden border border-gray-200">
      <img [src]="imageUrl()" alt="Event image preview" class="preview-img" />
      <button
        type="button"
        (click)="removeImage()"
        class="absolute top-2 right-2 px-3 py-1.5 rounded-lg bg-black/60 hover:bg-black/80 text-white text-xs font-semibold border-0 cursor-pointer"
      >
        Remove
      </button>
    </div>
  } @else {
    <label
      [for]="inputId"
      class="flex flex-col items-center justify-center gap-2 px-6 py-10 rounded-xl border-2 border-dashed text-center cursor-pointer transition-colors"
      [class.border-red-500]="isDragging()"
      [class.bg-red-50]="isDragging()"
      [class.border-gray-300]="!isDragging()"
      [class.bg-gray-50]="!isDragging()"
      [class.pointer-events-none]="uploading()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      @if (uploading()) {
        <p class="text-sm font-semibold text-gray-700 m-0">Uploading... {{ uploadProgress() }}%</p>
        <div class="w-full max-w-xs h-2 rounded-full bg-gray-200 overflow-hidden">
          <div class="h-full bg-red-600 transition-all duration-200" [style.width.%]="uploadProgress()"></div>
        </div>
      } @else {
        <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <p class="text-sm text-gray-700 m-0">
          <span class="font-semibold text-red-600">Click to upload</span> or drag and drop
        </p>
        <p class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 border border-amber-200 text-xs font-semibold text-amber-800 m-0">
          Only .webp images are accepted (max {{ maxSizeMb }} MB)
        </p>
        <!-- Images are resized to 800x450 on Cloudinary, so this is the recommended resolution -->
        <p class="text-xs text-gray-500 m-0">Recommended resolution: {{ recommendedSize }} (16:9)</p>
      }
    </label>
    <input [id]="inputId" type="file" accept=".webp,image/webp" class="hidden" (change)="onFileSelected($event)" />
  }

  @if (uploadError()) {
    <p class="mt-2 mb-0 text-sm text-red-600" role="alert">{{ uploadError() }}</p>
  }
</div>
