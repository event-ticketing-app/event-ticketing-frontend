<div class="p-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Events</h1>
    <button mat-raised-button color="primary" (click)="openCreateEvent()">+ Create Event</button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-50 border-b border-gray-100">
        <tr>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">TicketCapacity</th>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">OrganizerName</th>
          <th class="text-left px-6 py-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for(event of filteredEvents; track event.id) {
          <tr class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4 text-sm text-gray-900">{{ event.name }}</td>
            <td class="px-6 py-4 text-sm text-gray-500">{{ event.date }}</td>
            <td class="px-6 py-4 text-sm text-gray-500">{{ event.price }}</td>
            <td class="px-6 py-4 text-sm text-gray-500">{{ event.ticketCapacity }}</td>
            <td class="px-6 py-4 text-sm text-gray-500">{{ event.organizerName }}</td>
            <td class="px-6 py-4 flex gap-2">
              <button mat-raised-button color="primary" (click)="openEditEvent(event)">Edit</button>
              <button mat-raised-button color="warn" (click)="deleteEvent(event.id)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
