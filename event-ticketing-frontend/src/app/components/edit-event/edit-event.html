<div class="form-container">
  <h1>Edit Event</h1>
  <form (ngSubmit)="updateEvent()">
    
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="name" name="name" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput [(ngModel)]="description" name="description" rows="4"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="date" name="date" />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price (€)</mat-label>
      <input matInput type="number" [(ngModel)]="price" name="price" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Image URL</mat-label>
      <input matInput [(ngModel)]="imageUrl" name="imageUrl" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ticket Capacity</mat-label>
      <input matInput type="number" [(ngModel)]="ticketCapacity" name="ticketCapacity" />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">Save Changes</button>
  </form>
</div>
