<div class="p-6">
  <div class="flex items-start gap-4">
    <div class="w-11 h-11 shrink-0 rounded-full bg-red-100 flex items-center justify-center text-red-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>
    <div>
      <h2 class="text-lg font-bold text-gray-900 m-0">{{ data.title }}</h2>
      <p class="mt-2 mb-0 text-sm text-gray-600">{{ data.message }}</p>
    </div>
  </div>

  <div class="flex justify-end gap-3 mt-6">
    <button mat-stroked-button [mat-dialog-close]="false">
      {{ data.cancelText ?? 'Cancel' }}
    </button>
    <button mat-flat-button color="warn" [mat-dialog-close]="true">
      {{ data.confirmText ?? 'Delete' }}
    </button>
  </div>
</div>
